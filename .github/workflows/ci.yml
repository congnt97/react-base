name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  # Mỗi PR: nhanh (~1 phút). Bắt lỗi type, lint, format, cấu trúc, code chết,
  # unit/component test, build, bundle size.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm size

  # E2E nặng (cài Chromium, ~3 phút) nên chỉ chạy khi merge vào main, PR gắn label `e2e`,
  # hoặc chạy tay. Luồng chính vẫn được bảo vệ trước khi lên môi trường.
  e2e:
    runs-on: ubuntu-latest
    needs: check
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
