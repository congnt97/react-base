name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  # Mỗi PR: nhanh (~1 phút). Bắt lỗi type, lint, format, cấu trúc, code chết,
  # unit/component test, build, bundle size.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sửa guard (lint, ngưỡng coverage, script kiểm tra, CI) phải là quyết định có chủ đích:
      # PR đụng các file này bắt buộc gắn label `guards` để reviewer nhìn thấy.
      - name: Sửa guard phải có label guards
        if: github.event_name == 'pull_request'
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'guards') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- eslint.config.js vitest.config.ts tsconfig.json scripts/ .github/ knip.json pnpm-workspace.yaml)
          if [ -n "$changed" ] && [ "$HAS_LABEL" != "true" ]; then
            echo "PR sửa file guard nhưng thiếu label 'guards':"
            echo "$changed"
            exit 1
          fi
      - run: pnpm validate
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm size

  # E2E nặng (cài Chromium, ~3 phút) nên chỉ chạy khi merge vào main, PR gắn label `e2e`,
  # hoặc chạy tay. Luồng chính vẫn được bảo vệ trước khi lên môi trường.
  e2e:
    runs-on: ubuntu-latest
    needs: check
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
