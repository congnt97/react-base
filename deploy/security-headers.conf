# Include trong server và trong MỌI location có add_header riêng, vì nginx không kế thừa
# add_header khi location tự khai add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# style 'unsafe-inline' vì Ant Design dùng css-in-js; script không cần inline.
# Nới connect-src/img-src khi gọi domain ngoài (CDN, S3, analytics).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
